proxy-groups:
- name: 🔰国外流量
  type: select
  proxies:
  - 自动选择
  - 故障转移
  - 🚀直接连接
  include-all: true
- name: 自动选择
  type: url-test
  interval: 86400
  url: http://www.gstatic.com/generate_204
  proxies: []
  include-all: true
- name: 故障转移
  type: fallback
  interval: 7200
  url: http://www.gstatic.com/generate_204
  proxies: []
  include-all: true
- name: ⚓️其他流量
  type: select
  proxies:
  - 🔰国外流量
  - 🚀直接连接
  include-all: true
  filter: ^\[aws-
- name: ✈️Telegram
  type: select
  proxies:
  - 🔰国外流量
  include-all: true
- name: 🎬Youtube
  type: select
  proxies:
